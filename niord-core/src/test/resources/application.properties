################################################################################
# Test configuration for niord-core.
#
# The database is an externally-managed MySQL container, NOT Dev Services and
# NOT H2. The shared hibernate_sequence behaviour, the native ENUM columns and
# the spatial types are precisely what these tests exist to exercise, and an
# in-memory substitute would quietly not exercise any of them.
#
#   docker run -d --name niord-test-db -p 13306:3306 \
#     -e MYSQL_ROOT_PASSWORD=mysql -e MYSQL_DATABASE=niord \
#     -e MYSQL_USER=niord -e MYSQL_PASSWORD=niord mysql:8.0.35
#
# Keeping the container outside the build is deliberate: it stays warm between
# runs, and the schema survives for inspection after a failing test.
################################################################################

quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:13306/niord
quarkus.datasource.username=niord
quarkus.datasource.password=niord

quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
# Flyway owns the schema here exactly as it does in a deployment. Hibernate must
# NOT also generate it: with both active, whichever ran last would win and the
# migration would never be exercised by the tests that matter.
#
# The container is seeded once with schema/baseline-MaDaMe.sql; Flyway then
# baselines it at version 0 and applies the migrations on top. See the root README.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.log.sql=false

# Matches the deployed configuration; changing either silently changes how ids
# and sequences are allocated.
quarkus.hibernate-orm.unsupported-properties."hibernate.id.db_structure_naming_strategy"=legacy
quarkus.hibernate-orm.unsupported-properties."hibernate.search.backend.directory.root"=target/.lucene
quarkus.hibernate-orm.unsupported-properties."hibernate.search.backend.lucene_version"=8.11.1
quarkus.hibernate-orm.unsupported-properties."hibernate.search.mapping.configurer"=class:org.niord.core.db.QuarkusHibernateOrmSearchMappingConfigurer

quarkus.index-dependency.geometry.group-id=org.locationtech.jts
quarkus.index-dependency.geometry.artifact-id=jts-core

# Niord has always written dates as timestamps; retained through the Quarkus
# transition and asserted against by the fixtures.
quarkus.jackson.write-dates-as-timestamps=true

# No identity provider in a unit test.
quarkus.oidc.enabled=false
quarkus.keycloak.policy-enforcer.enable=false

# App-level settings that live in the niord-dk overlay in a real deployment.
# Beans in niord-core demand them at startup, so they are supplied here rather
# than discovered one failure at a time.
niord.smtp.host=localhost
niord.smtp.port=1025
quarkus.qpid-jms.url=amqp://localhost:5672
quarkus.qpid-jms.username=niord
quarkus.qpid-jms.password=niord
niord.jms.topic.messagestatustopic=messageStatus

quarkus.class-loading.parent-first-artifacts=stax:stax-api
quarkus.log.level=WARN
quarkus.log.category."org.niord".level=INFO
